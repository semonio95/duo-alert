name: monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ripristina stato
        uses: actions/cache/restore@v4
        with:
          path: duo_state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Installa curl_cffi
        run: pip install -q curl_cffi

      - name: Controlla disponibilita' ritiro (tutta Italia)
        run: python3 -u duo_alert.py --minutes 5 2>&1 | tee run.log
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Salva stato
        if: always()
        uses: actions/cache/save@v4
        with:
          path: duo_state.json
          key: duo-state-${{ github.run_id }}

      - name: Pubblica ultimo log (branch "logs")
        if: always()
        run: |
          mkdir -p /tmp/l && (cp run.log /tmp/l/ultimo_log.txt 2>/dev/null || echo "nessun log" > /tmp/l/ultimo_log.txt)
          cd /tmp/l && git init -q && git checkout -q -b logs
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m "Log run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logs
