name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Dettagli offerte Amazon
        run: |
          pip install -q curl_cffi >/dev/null 2>&1
          python3 - > diag.txt 2>&1 <<'PY' || true
          import re, time, html
          from curl_cffi import requests as r
          def clean(x): return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x))).strip()
          def grab(t, pat, n=160):
              m = re.search(pat, t, re.S); return clean(m.group(1))[:n] if m else None
          for dom, lang in {"com.be": "fr-BE", "nl": "nl-NL"}.items():
              s = r.Session(impersonate="chrome")
              H = {"Accept-Language": f"{lang},{lang[:2]};q=0.9"}
              t = s.get(f"https://www.amazon.{dom}/s?k=apple+iphone+duo", headers=H, timeout=30).text
              asins = []
              for a in dict.fromkeys(re.findall(r'data-asin="(B0[A-Z0-9]{8})"[^>]*data-component-type="s-search-result"', t)):
                  m = re.search(r'data-asin="%s".{0,6000}?<h2[^>]*>(.*?)</h2>' % a, t, re.S)
                  ttl = clean(m.group(1)) if m else ""
                  if re.search(r"(?i)^apple iphone duo \d", ttl): asins.append((a, ttl))
              print(f"== amazon.{dom}: {len(asins)} iPhone Duo")
              for a, ttl in asins:
                  p = s.get(f"https://www.amazon.{dom}/dp/{a}", headers=H, timeout=30).text
                  print(f"-- {a} {ttl[:60]}")
                  print("   avail:", grab(p, r'id="availability"[^>]*>(.*?)</div>'))
                  print("   price:", grab(p, r'id="corePrice(?:Display_desktop)?_feature_div".*?<span class="a-offscreen">([^<]+)<'), "|", grab(p, r'class="a-price aok-align-center[^"]*".*?<span class="a-offscreen">([^<]+)<'))
                  print("   merchant:", grab(p, r'id="merchantInfoFeature_feature_div"(.*?)</div>\s*</div>', 200), "|", grab(p, r'id="sellerProfileTriggerId"[^>]*>(.*?)</a>'))
                  print("   ships:", grab(p, r'id="fulfillerInfoFeature_feature_div"(.*?)</div>\s*</div>', 120))
                  print("   delivery:", grab(p, r'id="mir-layout-DELIVERY_BLOCK"(.*?)</div>', 200))
                  print("   cart:", "add-to-cart-button" in p, "| buybox other sellers:", grab(p, r'id="olpLinkWidget_feature_div"(.*?)</div>', 120))
                  time.sleep(2)
          PY
          cat diag.txt

      - name: Pubblica risultato
        if: always()
        run: |
          mkdir -p /tmp/l && cp diag.txt /tmp/l/diag.txt && cd /tmp/l && git init -q && git checkout -q -b diag
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m diag
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
