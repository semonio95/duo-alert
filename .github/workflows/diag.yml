name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Cerca endpoint ritiro nella pagina Apple
        run: |
          pip install -q curl_cffi >/dev/null 2>&1
          python3 - > diag.txt 2>&1 <<'EOF' || true
          from curl_cffi import requests as r
          import re
          s = r.Session(impersonate="chrome")
          url = "https://www.apple.com/it/shop/buy-iphone/iphone-duo/display-da-7,6%22-256gb-bianco-stellare"
          b = s.get(url, headers={"Accept-Language": "it-IT,it;q=0.9"}, timeout=30)
          html = b.text.replace("\\u002F", "/").replace("\\/", "/")
          print("config page", b.status_code, len(html))
          seen = set()
          for m in re.finditer(r'(?i)(fulfil+ment|pickup|retail[A-Za-z]*Url|deliveryMessage|storeSearch|swap-?url|/shop/[a-z0-9\-/]+(message|pickup|fulfil|availability|store)[a-z0-9\-/]*)', html):
              a = max(0, m.start() - 120); z = min(len(html), m.end() + 160)
              snip = html[a:z].replace("\n", " ")
              key = m.group(0).lower()[:40]
              if key in seen and len(seen) > 5: continue
              seen.add(key)
              print("---", snip)
              if len(seen) > 40: break
          urls = sorted(set(re.findall(r'(/(?:it/)?shop/(?:[a-z0-9\-]+/)*[a-z0-9\-]*(?:message|pickup|fulfil|availability|retail|store)[a-z0-9\-/]*)', html, re.I)))
          print("\n== PATH CANDIDATI:")
          for u in urls[:80]: print(u)
          EOF
          cat diag.txt | head -c 20000

      - name: Pubblica risultato
        if: always()
        run: |
          mkdir -p /tmp/l && cp diag.txt /tmp/l/diag.txt && cd /tmp/l && git init -q && git checkout -q -b diag
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m diag
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
