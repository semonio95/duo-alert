name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Mappa codici e campi negozio
        run: |
          pip install -q curl_cffi >/dev/null 2>&1
          python3 - > diag.txt 2>&1 <<'PY' || true
          import re, json, urllib.parse
          from curl_cffi import requests as r
          s = r.Session(impersonate="chrome")
          base = "https://www.apple.com/it/shop/buy-iphone/iphone-duo"
          h = s.get(base, timeout=30).text.replace("\\u002F", "/")
          links = sorted(set(re.findall(r'/it/shop/buy-iphone/iphone-duo/[^"\'\s<>?#]+', h)))
          for l in links:
              t = s.get("https://www.apple.com" + l, timeout=30).text.replace("\\u002F", "/")
              ld = re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>', t, re.S)
              skus = re.findall(r'"sku"\s*:\s*"(M[A-Z0-9]{4}QL/A)', " ".join(ld))
              near = re.findall(r'"name"\s*:\s*"([^"]{0,80})"[^{}]{0,300}?"sku"\s*:\s*"(M[A-Z0-9]{4}QL/A)', t)
              slug = urllib.parse.unquote(l.rsplit("/", 1)[-1])
              print(slug, "| ld skus:", skus[:4], "| name~sku:", near[:3])
          q = {"pl": "true", "location": "00191", "parts.0": "MK2D4QL/A"}
          x = s.get("https://www.apple.com/it/shop/retail/pickup-message", params=q, timeout=30).json()
          st = x["body"]["stores"]
          print("n negozi per 00191:", len(st))
          print("chiavi store:", sorted(st[0].keys()))
          print("esempio:", json.dumps({k: st[0][k] for k in st[0] if k not in ("retailStore","storeHours","partsAvailability")}, ensure_ascii=False)[:800])
          print("parts esempio:", json.dumps(st[0]["partsAvailability"], ensure_ascii=False)[:800])
          for loc in ["20121", "10121", "95131"]:
              y = s.get("https://www.apple.com/it/shop/retail/pickup-message", params={**q, "location": loc}, timeout=30).json()
              print(loc, [z.get("storeName") for z in y["body"]["stores"]])
          print("00191", [z.get("storeName") for z in st])
          PY
          cat diag.txt

      - name: Pubblica risultato
        if: always()
        run: |
          mkdir -p /tmp/l && cp diag.txt /tmp/l/diag.txt && cd /tmp/l && git init -q && git checkout -q -b diag
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m diag
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
