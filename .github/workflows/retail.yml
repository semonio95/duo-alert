name: retail

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Controllo rivenditori
        run: |
          pip install -q curl_cffi >/dev/null 2>&1
          python3 - > retail.txt 2>&1 <<'PY' || true
          import re, time
          from curl_cffi import requests as r
          s = r.Session(impersonate="chrome")
          H = {"Accept-Language": "it-IT,it;q=0.9"}
          urls = [
            "https://www.unieuro.it/online/iPhone/iPhone-Duo-256GB-Bianco-stellare-pidAPLIPHONEDUO256W",
            "https://www.unieuro.it/online/iPhone/iPhone-Duo-256GB-Cielo-notturno-pidAPLIPHONEDUO256",
            "https://www.unieuro.it/online/iPhone/iPhone-Duo-512GB-Bianco-stellare-pidAPLIPHONEDUO512W",
            "https://www.unieuro.it/online/iPhone/iPhone-Duo-512GB-Cielo-notturno-pidAPLIPHONEDUO512",
            "https://www.unieuro.it/online/iPhone/iPhone-Duo-1TB-Bianco-stellare-pidAPLIPHONEDUO1TBW",
            "https://www.unieuro.it/online/iPhone/iPhone-Duo-2TB-Bianco-stellare-pidAPLIPHONEDUO2TBW",
            "https://www.mediaworld.it/it/product/_apple-iphone-duo-256gb-star-white-596069.html",
            "https://www.mediaworld.it/it/product/_apple-iphone-duo-512gb-star-white-596071.html",
            "https://www.mediaworld.it/it/search.html?query=iphone%20duo",
            "https://www.amazon.it/s?k=apple+iphone+duo",
            "https://www.euronics.it/search?q=iphone+duo",
            "https://www.rstore.it/search?q=iphone+duo",
            "https://www.trovaprezzi.it/prezzo_cellulari_iphone_duo.aspx",
            "https://www.idealo.it/risultati.html?q=iphone+duo",
          ]
          KW = r'(?i)(InStock|OutOfStock|PreOrder|BackOrder|SoldOut|"availability"\s*:\s*"[^"]{0,60}"|non disponibile|esaurit[oa]|disponibile|aggiungi al carrello|preordin\w+|consegna (?:prevista|stimata)[^<"]{0,60}|disponibilit[aà][^<"]{0,80})'
          for u in urls:
              try:
                  x = s.get(u, headers=H, timeout=30)
                  t = x.text
                  print("\n==", x.status_code, len(t), u)
                  hits = []
                  for m in re.finditer(KW, t):
                      a, z = max(0, m.start()-60), min(len(t), m.end()+60)
                      snip = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t[a:z]))
                      if snip not in hits: hits.append(snip)
                      if len(hits) >= 8: break
                  for h in hits: print("   ", h[:220])
                  if "duo" in u and "amazon" in u:
                      for m in re.finditer(r'(?i)iPhone Duo[^<]{0,80}', t):
                          print("   AMZ:", m.group(0)[:120]); 
              except Exception as e:
                  print("\n== ERR", u, e)
              time.sleep(1)
          PY
          cat retail.txt | head -c 30000

      - name: Pubblica risultato
        if: always()
        run: |
          mkdir -p /tmp/l && cp retail.txt /tmp/l/retail.txt && cd /tmp/l && git init -q && git checkout -q -b diag
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m retail
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
