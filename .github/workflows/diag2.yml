name: diag2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Prova altri negozi
        run: |
          pip install -q curl_cffi >/dev/null 2>&1
          python3 - > diag.txt 2>&1 <<'PY' || true
          import re, json, time
          from curl_cffi import requests as r
          s = r.Session(impersonate="chrome")
          H = {"Accept-Language": "it-IT,it;q=0.9"}
          for code in ["mk2d4ql-a","mk2e4ql-a","mk2f4ql-a","mk2g4ql-a","mk2h4ql-a","mk2j4ql-a","mk2k4ql-a","mk2l4ql-a"]:
              u = f"https://www.rstore.it/products/iphone-duo-{code}"
              x = s.get(u + ".js", headers=H, timeout=30)
              if x.status_code != 200:
                  print(code, x.status_code); continue
              j = x.json()
              print(code, "|", j.get("title"), "| available:", j.get("available"), "| tags:", [t for t in j.get("tags", []) if any(k in t.lower() for k in ("pre", "disp", "stock", "ordin", "arriv"))][:6])
              for v in j.get("variants", []):
                  print("    variant", v.get("id"), v.get("title"), "| available:", v.get("available"), "| price:", v.get("price"), "| inv_mgmt:", v.get("inventory_management"), "| policy:", v.get("inventory_policy"))
              pg = s.get(u, headers=H, timeout=30).text
              for pat in [r"(?i)(preordin[^<]{0,80})", r"(?i)(disponibile[^<]{0,80})", r"(?i)(esaurit[^<]{0,60})", r"(?i)(spedizione[^<]{0,80})", r"(?i)(consegna[^<]{0,80})", r"(?i)(aggiungi al carrello)", r"(?i)(avvisami[^<]{0,40})"]:
                  m = re.findall(pat, pg)
                  if m: print("    page:", list(dict.fromkeys(x.strip() for x in m))[:3])
              time.sleep(1)
          PY
          cat diag.txt
      - name: Pubblica risultato
        if: always()
        run: |
          mkdir -p /tmp/l && cp diag.txt /tmp/l/diag.txt && cd /tmp/l && git init -q && git checkout -q -b diag
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m diag
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
