name: diag2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Prova altri negozi
        run: |
          pip install -q curl_cffi >/dev/null 2>&1
          python3 - > diag.txt 2>&1 <<'PY' || true
          import re, json, time
          from curl_cffi import requests as r
          s = r.Session(impersonate="chrome")
          H = {"Accept-Language": "it-IT,it;q=0.9"}
          U = {
           "rstore-suggest": "https://www.rstore.it/search/suggest.json?q=iphone%20duo&resources[type]=product&resources[limit]=10",
           "euronics": "https://www.euronics.it/search?q=iphone+duo",
           "comet": "https://www.comet.it/search?q=iphone%20duo",
           "expert": "https://www.expertonline.it/search?q=iphone+duo",
           "trony": "https://www.trony.it/online/search?q=iphone%20duo",
           "monclick": "https://www.monclick.it/ricerca?q=iphone+duo",
           "eprice": "https://www.eprice.it/sa/?qs=iphone+duo",
           "yeppon": "https://www.yeppon.it/ricerca?q=iphone+duo",
           "tim": "https://www.tim.it/fisso-e-mobile/mobile/smartphone/apple",
           "vodafone": "https://www.vodafone.it/privati/offerte-smartphone/apple.html",
           "windtre": "https://www.windtre.it/smartphone/apple/",
           "iliad": "https://www.iliad.it/smartphone.html",
           "fastweb": "https://www.fastweb.it/smartphone-e-tablet/",
           "very-mobile": "https://verymobile.it/smartphone",
          }
          for k, u in U.items():
              try:
                  x = s.get(u, headers=H, timeout=30)
                  t = x.text
                  duo = len(re.findall(r"(?i)iphone[\s\-_]*duo", t))
                  kw = sorted(set(m.lower() for m in re.findall(r"(?i)(esaurit[oa]|non disponibile|disponibile|aggiungi al carrello|in stock|outofstock|instock|preorder|preordin\w*|avvisami)", t)))[:8]
                  print(f"{k:12} {x.status_code} len={len(t):7} duo={duo:3} kw={kw} url={x.url[:90]}")
                  if k == "rstore-suggest":
                      try:
                          for p in x.json()["resources"]["results"]["products"]:
                              print("     ", p.get("title"), "| available:", p.get("available"), "| handle:", p.get("handle"), "| price:", p.get("price"))
                      except Exception as e:
                          print("      parse", e, t[:200])
              except Exception as e:
                  print(f"{k:12} ERR {e}")
              time.sleep(1)
          PY
          cat diag.txt
      - name: Pubblica risultato
        if: always()
        run: |
          mkdir -p /tmp/l && cp diag.txt /tmp/l/diag.txt && cd /tmp/l && git init -q && git checkout -q -b diag
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m diag
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
