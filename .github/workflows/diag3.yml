name: diag3
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Contatti e annullamento R-Store
        run: |
          pip install -q curl_cffi >/dev/null 2>&1
          python3 - > diag.txt 2>&1 <<'PY' || true
          import re, html, time
          from curl_cffi import requests as r
          s = r.Session(impersonate="chrome")
          H = {"Accept-Language": "it-IT,it;q=0.9"}
          def txt(x): return re.sub(r"\s+", " ", html.unescape(re.sub(r"<(script|style)[^>]*>.*?</\1>|<[^>]+>", " ", x, flags=re.S))).strip()
          for l in ["/pages/contattaci", "/pages/assistenza", "/pages/spedizione-e-ritiro"]:
              raw = s.get("https://www.rstore.it" + l, headers=H, timeout=30).text
              main = re.search(r"<main.*?</main>", raw, re.S)
              t = txt(main.group(0) if main else raw)
              print(f"\n== {l}\n", t[:2500])
              print("   mailto:", sorted(set(re.findall(r'mailto:([^"?]+)', raw))), "| tel:", sorted(set(re.findall(r'tel:([^"]+)', raw))), "| wa:", sorted(set(re.findall(r'(?:wa\.me|whatsapp)[^"\s]*', raw)))[:3])
              time.sleep(1)
          PY
          cat diag.txt
      - name: Pubblica risultato
        if: always()
        run: |
          mkdir -p /tmp/l && cp diag.txt /tmp/l/diag.txt && cd /tmp/l && git init -q && git checkout -q -b diag
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" add .
          git -c user.name="duo-alert" -c user.email="duo-alert@users.noreply.github.com" commit -q -m diag
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
